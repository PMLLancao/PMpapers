<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b70"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>PaperScope</title>
<style>
:root{--b:#f5f7f6;--c:#fff;--i:#17211f;--m:#66736f;--l:#dbe5e1;--a:#0b6b70;--g:#17683b;--r:#a33954;font-family:Inter,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i)}button,input,textarea{font:inherit}.wrap{max-width:1050px;margin:auto;padding:12px 12px 80px}.head{position:sticky;top:0;z-index:10;background:rgba(245,247,246,.94);backdrop-filter:blur(12px);padding:10px 0}.row,.actions,.tabs,.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.logo{width:40px;height:40px;border-radius:12px;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:900}h1{font-size:1.2rem;margin:0}h2{margin:16px 0 4px}.muted{color:var(--m);font-size:.84rem}.search{flex:1;min-width:180px;border:1px solid var(--l);border-radius:13px;padding:11px 13px;background:#fff}.btn,.tab{border:1px solid var(--l);background:#fff;border-radius:12px;padding:9px 11px;font-weight:750;cursor:pointer}.primary,.tab.active{background:var(--a);border-color:var(--a);color:#fff}.tabs{overflow:auto;flex-wrap:nowrap;padding:10px 0}.tab{white-space:nowrap;border-radius:999px}.feed{display:grid;gap:12px}.paper{background:var(--c);border:1px solid var(--l);border-radius:17px;padding:15px;box-shadow:0 8px 25px rgba(20,45,40,.06)}.paper h3{margin:0 0 7px;line-height:1.35}.meta{color:var(--m);font-size:.78rem;margin-bottom:9px}.chip{font-size:.74rem;background:#eef3f1;border-radius:999px;padding:5px 8px}.why{background:#f4faf8;border-radius:12px;padding:9px 11px;margin:10px 0;font-size:.88rem}.paper p{line-height:1.5}.paper details{border-top:1px solid var(--l);padding-top:9px}.paper summary{font-weight:800;cursor:pointer}.actions{margin-top:11px}.actions .btn{padding:7px 9px;font-size:.84rem;text-decoration:none;color:inherit}.actions .primary{color:#fff}.on.good{background:#e7f4ea;color:var(--g)}.on.bad{background:#f8e8ed;color:var(--r)}.empty{text-align:center;background:#fff;border:1px solid var(--l);border-radius:17px;padding:25px;color:var(--m)}.sheet{display:none;position:fixed;inset:0;background:#0006;z-index:30;align-items:flex-end}.sheet.open{display:flex}.box{width:100%;max-width:600px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}.reason{width:100%;text-align:left;margin:4px 0}.note{width:100%;min-height:80px;border:1px solid var(--l);border-radius:12px;padding:10px;margin:8px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17211f;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:50}.toast.show{display:block}@media(min-width:760px){.feed{grid-template-columns:1fr 1fr}.paper:first-child{grid-column:1/-1}}
</style>
</head>
<body><div class="wrap"><header class="head">
<div class="row between"><div class="row"><div class="logo">PS</div><div><h1>PaperScope</h1><div class="muted">Your scientific briefing</div></div></div><div class="muted" id="status">Loading…</div></div>
<div class="row" style="margin-top:10px"><input id="search" class="search" placeholder="Search proteins, methods, papers…"><button class="btn primary" id="install">Install</button></div>
<div class="row between" style="margin-top:8px"><button class="btn" id="refresh">Check latest</button><button class="btn" id="export">Export feedback</button></div>
<div class="tabs" id="tabs"></div></header>
<div class="row between"><div><h2 id="title">Latest</h2><div class="muted" id="desc"></div></div><div class="muted" id="count"></div></div>
<main class="feed" id="feed"></main></div>
<div class="sheet" id="report"><div class="box"><h3>Report a problem</h3><div class="muted" id="rtitle"></div><div id="reasons"></div><textarea class="note" id="note" placeholder="Optional note"></textarea><div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="saveReport">Save report</button></div></div></div>
<div class="sheet" id="installSheet"><div class="box"><h3>Install PaperScope</h3><p id="installText"></p><div class="actions"><button class="btn primary" id="nativeInstall" style="display:none">Install now</button><button class="btn" id="closeInstall">Close</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DATA='https://raw.githubusercontent.com/PMLLancao/PMpapers/main/data/papers.json', META='https://raw.githubusercontent.com/PMLLancao/PMpapers/main/data/meta.json', KEY='paperscope-v1';
const S=[['latest','Latest','Newest prepared papers'],['focus','Research Focus','MAPK8IP3/JIP3 and directly relevant JIP4'],['lysosome','Lysosome','Lysosome, damage, repair and endolysosomal biology'],['traffic','Trafficking','Intracellular and axonal transport'],['signaling','Signaling','cAMP/EPAC/PKA, AKT, Rabs, Rho-family and regulators'],['neurodeg','Neurodegeneration','Parkinson/LRRK2, ALS/FTD and Alzheimer mechanisms'],['reviews','Reviews','Review and synthesis papers'],['preprints','Preprints','bioRxiv and arXiv'],['saved','Saved','Your reading shortlist']];
const REASONS=['Wrong section','Not relevant','Wrong protein/pathway match','Wrong model/tissue','Bad summary','Duplicate','Bad journal/source','Other'];
const st=JSON.parse(localStorage.getItem(KEY)||'{"tab":"latest","q":"","saved":[],"likes":[],"dislikes":[],"reports":[]}');
let P=[],deferred=null,reporting=null,reason='';
const g=id=>document.getElementById(id), save=()=>localStorage.setItem(KEY,JSON.stringify(st));
function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function blob(p){return [p.title,p.abstract,p.journal,p.authors,p.topic,(p.matched_topics||[]).join(' ')].join(' ').toLowerCase()}
function words(x){return x.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean)}
function exact(b,arr){var w=words(b);return arr.some(function(t){return w.includes(t.toLowerCase())})}
function any(b,arr){return arr.some(function(t){return b.includes(t.toLowerCase())})}
function id(p){return String(p.pmid||p.doi||p.url||p.title)}
function inSection(p,s){var b=blob(p);if(s==='latest')return true;if(s==='saved')return st.saved.includes(id(p));if(s==='reviews')return !!p.review||String(p.type||'').toLowerCase().includes('review');if(s==='preprints')return p.source_type==='preprint'||any(b,['biorxiv','arxiv']);if(s==='focus')return exact(b,['mapk8ip3','jip3'])||(exact(b,['jip4'])&&any(b,['neuron','axon','lysosome','endosome','transport']));if(s==='lysosome')return any(b,['lysosome','lysosomal','lysophagy','endolysosomal','membrane damage','membrane repair','ferroptosis']);if(s==='traffic')return any(b,['axonal transport','organelle transport','vesicle trafficking','retromer','retriever','wash complex','commander','exocyst','escrt','hops','corvet','dynein','dynactin','kinesin']);if(s==='signaling')return exact(b,['epac','pka','akap','akt','akt1','akt2','akt3','pi3k','mtor','cc2d1a','cc2d1b','rab7','rab10','rab12','rab36','rhoa','rhob','rhoc','rac1','rac2','rac3','cdc42','tmem55b','rilpl1','tbk1','sting','chmp4b','spag9']);if(s==='neurodeg')return any(b,['parkinson','lrrk2','amyotrophic lateral sclerosis','frontotemporal','alzheimer'])&&any(b,['neuron','microglia','astrocyte','lysosome','transport','trafficking','autophagy','axon','rab','rho']);return true}
function priority(p){return (p.score||0)>=92?'Must read':(p.score||0)>=82?'Worth reading':'Scan'}
function card(p){var x=id(p),sv=st.saved.includes(x),lk=st.likes.includes(x),dk=st.dislikes.includes(x),href=p.url||(p.pmid?'https://pubmed.ncbi.nlm.nih.gov/'+p.pmid+'/':'#'),sum=p.main||p.overview||p.abstract||'No abstract available.',why=p.why||('Matched: '+(p.matched_topics_label||p.topic||'your profile'));return '<article class="paper"><h3>'+esc(p.title)+'</h3><div class="meta">'+esc(p.year)+' · '+esc(p.journal)+' · '+esc(p.authors)+'</div><div class="chips"><span class="chip">'+priority(p)+'</span>'+(p.review?'<span class="chip">Review</span>':'')+'<span class="chip">'+esc(p.topic||'Relevant')+'</span></div><div class="why"><b>Why this is here:</b> '+esc(why)+'</div><p>'+esc(sum)+'</p><details><summary>Abstract + details</summary><p>'+esc(p.abstract||p.overview||'No additional text available.')+'</p></details><div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="'+esc(href)+'">Open paper</a><button class="btn '+(sv?'on good':'')+'" data-a="save" data-id="'+esc(x)+'">'+(sv?'Saved':'Save')+'</button><button class="btn '+(lk?'on good':'')+'" data-a="like" data-id="'+esc(x)+'">👍</button><button class="btn '+(dk?'on bad':'')+'" data-a="dislike" data-id="'+esc(x)+'">👎</button><button class="btn" data-a="report" data-id="'+esc(x)+'">Report</button></div></article>'}
function tabs(){g('tabs').innerHTML=S.map(function(x){return '<button class="tab '+(st.tab===x[0]?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('');document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){st.tab=b.dataset.tab;save();render()}})}
function render(){tabs();var sec=S.find(function(x){return x[0]===st.tab})||S[0],q=(st.q||'').toLowerCase(),items=P.filter(function(p){return inSection(p,st.tab)&&(!q||blob(p).includes(q))&&!st.dislikes.includes(id(p))}).sort(function(a,b){return (b.year||0)-(a.year||0)||(b.score||0)-(a.score||0)});g('title').textContent=sec[1];g('desc').textContent=sec[2];g('search').value=st.q||'';g('count').textContent=items.length+' papers';g('feed').innerHTML=items.length?items.slice(0,30).map(card).join(''):'<div class="empty">No papers in this section yet.</div>';document.querySelectorAll('[data-a]').forEach(function(b){b.onclick=act})}
function act(e){var b=e.currentTarget,x=b.dataset.id,a=b.dataset.a,p=P.find(function(z){return id(z)===x});if(a==='save')st.saved=st.saved.includes(x)?st.saved.filter(function(z){return z!==x}):st.saved.concat([x]);if(a==='like'){st.dislikes=st.dislikes.filter(function(z){return z!==x});st.likes=st.likes.includes(x)?st.likes.filter(function(z){return z!==x}):st.likes.concat([x])}if(a==='dislike'){st.likes=st.likes.filter(function(z){return z!==x});if(!st.dislikes.includes(x))st.dislikes.push(x)}if(a==='report'){openReport(p);return}save();render()}
function openReport(p){reporting=p;reason='';g('rtitle').textContent=p.title;g('reasons').innerHTML=REASONS.map(function(r){return '<button class="btn reason" data-r="'+r+'">'+r+'</button>'}).join('');document.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){reason=b.dataset.r;document.querySelectorAll('[data-r]').forEach(function(x){x.classList.toggle('primary',x===b)})}});g('note').value='';g('report').classList.add('open')}
function toast(x){g('toast').textContent=x;g('toast').classList.add('show');setTimeout(function(){g('toast').classList.remove('show')},1600)}
g('cancel').onclick=function(){g('report').classList.remove('open')};g('saveReport').onclick=function(){if(!reporting||!reason){toast('Choose a reason');return}st.reports.push({at:new Date().toISOString(),paper_id:id(reporting),title:reporting.title,section:st.tab,reason:reason,note:g('note').value,topic:reporting.topic||'',journal:reporting.journal||''});save();g('report').classList.remove('open');toast('Report saved')};
g('search').oninput=function(e){st.q=e.target.value;save();render()};g('refresh').onclick=function(){load(true)};g('export').onclick=function(){var out={exported_at:new Date().toISOString(),likes:st.likes,dislikes:st.dislikes,reports:st.reports},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='paperscope-feedback.json';a.click();URL.revokeObjectURL(a.href)};
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e});g('install').onclick=function(){var txt=g('installText'),n=g('nativeInstall');if(deferred){n.style.display='inline-block';txt.textContent='PaperScope can be installed as an app on this device.'}else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){n.style.display='none';txt.textContent='On iPhone/iPad: tap Share in Safari, then Add to Home Screen.'}else{n.style.display='none';txt.textContent='Use your browser menu and choose Install app or Add to Home Screen.'}g('installSheet').classList.add('open')};g('nativeInstall').onclick=async function(){if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;g('installSheet').classList.remove('open')}};g('closeInstall').onclick=function(){g('installSheet').classList.remove('open')};
async function load(manual){if(manual)toast('Checking latest…');try{var t='?t='+Date.now(),r=await Promise.all([fetch(DATA+t,{cache:'no-store'}),fetch(META+t,{cache:'no-store'})]);if(!r[0].ok)throw Error();P=await r[0].json();var m=r[1].ok?await r[1].json():{},d=m.last_updated_utc?new Date(m.last_updated_utc):null;g('status').textContent=(d?'Updated '+d.toLocaleString():'Loaded')+' · '+(m.total_papers||P.length)+' papers';render();if(manual)toast('Feed refreshed')}catch(e){g('status').textContent='Offline / cached';g('feed').innerHTML='<div class="empty">Could not reach the latest feed. Try again online.</div>'}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');load(false);
</script></body></html>
