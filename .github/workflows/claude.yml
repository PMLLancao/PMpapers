# Claude Code GitHub Action: lets Claude respond when someone with write access writes
# @claude in an issue or pull-request comment (e.g. Issue #1, the Claude/ChatGPT thread).
# Based on anthropics/claude-code-action examples/claude.yml, with limits added for cost/safety.
#
# Requires (done once by the repository owner, see docs/SETUP_CLAUDE_GITHUB.md):
#   1. Claude GitHub App installed on this repository: https://github.com/apps/claude
#   2. Repository secret ANTHROPIC_API_KEY (Claude Console API key).
#      Using a Claude subscription instead? Add secret CLAUDE_CODE_OAUTH_TOKEN and swap the
#      two marked lines below.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-code          # one Claude run at a time, so two runs never edit the same files
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      # Regression tests run offline: no model download, no full-text fetching.
      PAPERSCOPE_SEMANTIC: "0"
      PAPERSCOPE_FULLTEXT: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install requests numpy

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}                 # API key (swap 1/2)
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # subscription (swap 2/2)
          # If ChatGPT posts through a bot account instead of PMLLancao, list it here, e.g.:
          # allowed_bots: "chatgpt-codex-connector[bot]"
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(python tests/test_gates.py),Bash(python tests/qa_offline.py),Bash(python -c *),Bash(pip install *)"
