name: Update literature data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_literature.py"
      - "config/search_config.json"
      - "tests/test_gates.py"

permissions:
  contents: write

concurrency:
  group: update-literature
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache topic-definition model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Install dependencies
        run: pip install requests fastembed numpy fastembed

      - name: Relevance regression tests (block publishing if any fail)
        run: python tests/test_gates.py
        env:
          PAPERSCOPE_SEMANTIC: "0"
          PAPERSCOPE_FULLTEXT: "0"

      - name: Run updater
        env:
          USER_EMAIL: pamunozl@um.uchile.cl
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/update_literature.py

      - name: Commit updated literature data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/meta.json data/briefing.json data/audit.json data/feeds
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update PaperScope literature data"
          git pull --rebase origin main
          git push origin HEAD:main
